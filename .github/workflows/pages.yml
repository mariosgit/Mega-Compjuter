# Builds the JU+TE Tiny emulator (emulator/) and publishes it on GitHub Pages:
#   https://mariosgit.github.io/Mega-Compjuter/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Emulator on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'emulator/**'
      - 'src/rom.cpp'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emulator/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: emulator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
